# Production deploy — every push to master (and manual runs).
#
# CI (ci.yml) must pass first. The release is built here, shipped as one
# tarball over SSH to a key that can only run /usr/local/sbin/dumuwaks-deploy
# (scripts/deploy/dumuwaks-deploy), which installs it as a new release, swaps
# symlinks, reloads PM2 and rolls back by itself if /health fails.
#
# Secrets (environment "production"):
#   VPS_HOST, VPS_USER     server address and login (root, forced-command key)
#   VPS_SSH_KEY            the deploy private key (ed25519, no passphrase)
#   VPS_KNOWN_HOSTS        pinned host key line(s) — never keyscan at deploy time
# Variables: PUBLIC_URL (default https://dumuwaks.co.ke)

name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  package:
    name: Build release
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npx vite build
        env:
          # Same origin: nginx proxies /api/v1 and /socket.io to the backend
          VITE_API_URL: /api/v1
          VITE_WHATSAPP_NUMBER: ${{ vars.WHATSAPP_NUMBER || '254799954672' }}
      - name: Pack release
        run: |
          mkdir -p out
          git archive --format=tar HEAD backend | tar -x -C out
          cp -r frontend/dist out/frontend
          printf '%s\n' "$GITHUB_SHA" > out/REVISION
          tar -czf release.tgz -C out .
          sha256sum release.tgz | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: release.tgz
          retention-days: 14
          if-no-files-found: error

  deploy:
    name: Deploy to VPS
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL || 'https://dumuwaks.co.ke' }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
      - name: Ship release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          for v in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            [ -n "${!v}" ] || { echo "::error::missing secret $v"; exit 1; }
          done
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o ConnectTimeout=20 \
              "$VPS_USER@$VPS_HOST" "deploy $GITHUB_SHA" < release.tgz
      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/deploy_key
      - name: Public smoke test
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://dumuwaks.co.ke' }}
        run: |
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$PUBLIC_URL/health"
          curl -fsS "$PUBLIC_URL/" | grep -q 'id="root"'
          curl -fsS "$PUBLIC_URL/api/v1/payments/config"
